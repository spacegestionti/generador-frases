name: Compilar APK y AAB Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Configurar local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Compilar APK Release (Para la Tablet del Jefe)
        run: flutter build apk --release

      - name: Compilar App Bundle AAB (Para Play Console)
        run: flutter build appbundle --release

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FraseSV-APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar AAB como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: FraseSV-AAB-PlayConsole
          path: build/app/outputs/bundle/release/app-release.aab
