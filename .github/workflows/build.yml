name: Compilar APK y AAB Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar Código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Compilar APK Release (Para la Tablet del Jefe)
        run: flutter build apk --release

      - name: Compilar App Bundle AAB (Para Play Console)
        run: flutter build appbundle --release

      - name: Guardar APK como Artefacto
        uses: actions/upload-artifact@v7
        with:
          name: FraseSV-APK-Release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Guardar AAB como Artefacto
        uses: actions/upload-artifact@v7
        with:
          name: FraseSV-AAB-PlayConsole
          path: build/app/outputs/bundle/release/app-release.aab
